[project]
name = "ray-setup"
version = "0.1.0"
description = "Локальная demo-среда для Ray-кластера и FastAPI-клиента"
readme = "README.md"
requires-python = ">=3.12.1"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pandas>=2.2,<3.0",
    "pytest>=8.3,<9.0",
    "ray[client]==2.37.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
